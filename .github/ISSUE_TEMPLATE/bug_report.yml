name: Bug report
description: Something in CensusChat does not work the way it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste API keys, `.env` contents, or query logs that contain them.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
      placeholder: |
        I asked "..." in the chat UI.
        I expected a result table. I got a 500.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. `docker compose up -d`
        2. Open http://localhost:3000
        3. Ask "..."
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part
      options:
        - Backend API (backend/)
        - Frontend (frontend/)
        - MCP server (backend/src/mcp/)
        - SQL validation (backend/src/validation/)
        - Census data loading (backend/scripts/)
        - DuckDB / query execution
        - Docker / local setup
        - Docs
        - Not sure
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error output
      description: Stack trace, failing test output, or the response body. Redact secrets.
      render: shell

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: "Run `node -v` and `docker --version`."
      placeholder: |
        OS: macOS 15.2
        Node: v20.18.0
        Docker: 27.3.1
        Ran via: docker compose / npm run dev
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before filing
      options:
        - label: I searched existing issues for a duplicate.
          required: true
        - label: I removed API keys and other secrets from everything pasted above.
          required: true
