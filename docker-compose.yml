version: '3.8'

# CensusChat Docker Environment
# ============================
# Complete development and demo setup with all required services
#
# Quick Start:
#   1. Copy .env.example to .env and fill required values
#   2. Run: ./demo-setup.sh (one command setup)
#
# Manual Usage:
#   docker-compose up -d          # Start all services
#   docker-compose logs -f        # View logs
#   docker-compose down           # Stop services
#
# Services:
#   - PostgreSQL (5432) - User data and sessions
#   - Redis (6379)      - Caching and rate limiting
#   - Backend (3001)    - API server with DuckDB
#   - Nao (5005)        - Analytics agent frontend

services:
  # PostgreSQL Database for user data and sessions
  postgres:
    image: postgres:15-alpine
    container_name: censuschat-postgres
    environment:
      POSTGRES_DB: censuschat
      POSTGRES_USER: censuschat_user
      POSTGRES_PASSWORD: dev_postgres_password_2024
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U censuschat_user -d censuschat"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching and rate limiting
  redis:
    image: redis:7-alpine
    container_name: censuschat-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: deps  # Only build to deps stage for development
    container_name: censuschat-backend
    volumes:
      - ./backend:/app
      - /app/node_modules  # Don't overwrite node_modules
      - ./backend/data:/app/data   # Share backend data directory for DuckDB production data
    environment:
      NODE_ENV: development
      DEBUG: "*"
      # Database connections use service names
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      # Copy other env vars
      JWT_SECRET: ${JWT_SECRET}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      CENSUS_API_KEY: ${CENSUS_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      DUCKDB_PATH: /app/data/census.duckdb
      CORS_ORIGIN: http://localhost:5005
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: npm run dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nao Analytics Agent Frontend (replaces Next.js frontend)
  # Note: The previous Next.js frontend service has been replaced by Nao.
  # The frontend/ directory and its Dockerfile can be removed in a future cleanup.
  nao:
    image: getnao/nao:latest
    container_name: censuschat-nao
    ports:
      - "5005:5005"
    volumes:
      - ./nao-project:/app/project:ro
      - ./backend/data:/app/data:ro
    environment:
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-changeme-in-production}
      - BETTER_AUTH_URL=http://localhost:5005
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - NAO_DEFAULT_PROJECT_PATH=/app/project
      - DATABASE_URL=postgresql://${POSTGRES_USER:-censuschat_user}:${POSTGRES_PASSWORD:-censuschat_pass}@postgres:5432/${POSTGRES_DB:-censuschat}
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: censuschat_network