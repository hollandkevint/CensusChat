# GitHub Pages Configuration for CensusChat
title: "CensusChat by Kevin Holland"
description: "Natural language queries over US Census demographics for healthcare strategy teams"
author: "Kevin Holland"
email: "kevin@kevintholland.com"
url: "https://hollandkevint.github.io"
baseurl: "/CensusChat"

# Theme
theme: minima

# Navigation
header_pages:
  - README.md
  - index.md

# SEO and Social
twitter:
  username: kevintholland
  card: summary_large_image

linkedin:
  username: kevintholland

github:
  username: hollandkevint
  repository: CensusChat

# Analytics (placeholder for future)
google_analytics: # GA_TRACKING_ID

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Markdown
markdown: kramdown
highlighter: rouge

# Collections
collections:
  docs:
    output: true
    permalink: /:collection/:name/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Kevin Holland"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
  - scope:
      path: ""
      type: "docs"
    values:
      layout: "page"

# Exclude from processing
exclude:
  - node_modules/
  - backend/
  - frontend/
  - test-data/
  - docker-compose*.yml
  - Dockerfile*
  - "*.log"
  - .env*
  - coverage/
  # Retired drafts. Without this they render as live pages and jekyll-sitemap
  # submits them for indexing; legacy-docs/GITHUB_PAGE.md carries the fabricated
  # customer testimonial this repo removed everywhere else.
  # scripts/check-marketing-claims.sh verifies this entry before exempting the tree.
  - archive/
  # Internal artifacts: session notes, epic planning, doc-status snapshots. Kept in git
  # for history, kept off the published site so the evaluator-facing surface stays small.
  # scripts/check-marketing-claims.sh verifies this entry before docs/internal/ may exist.
  - internal/
  # Belt and braces behind the docs/plans check in scripts/check-marketing-claims.sh:
  # a plan renders as a live page reprinting every claim it retires.
  - plans/